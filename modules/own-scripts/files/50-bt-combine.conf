# Virtual sink that mirrors audio to all connected Bluetooth headphones
context.modules = [
  { name = libpipewire-module-combine-stream
    args = {
      combine.mode = sink
      node.name = "bt_combined"
      node.description = "Both Headphones"
      combine.latency-compensate = true
      combine.props = { audio.position = [ FL FR ] }
      stream.props = { stream.dont-remix = true }
      stream.rules = [
        { matches = [ { media.class = "Audio/Sink" node.name = "~bluez_output.*" } ]
          actions = { create-stream = { } } }
      ]
    }
  }
]
